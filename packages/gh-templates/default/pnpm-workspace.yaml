# Self-contained workspace - prevents pnpm from inheriting parent workspace
packages:
  - '.'

# Prevent pnpm from linking workspace packages
linkWorkspacePackages: false

# Hoist MDC dependencies for Vite's optimizeDeps resolution
publicHoistPattern:
  - '*remark*'
  - '*rehype*'
  - '*unified*'
  - '*unist*'
  - '*parse5*'
  - '*debug*'

# Dependency build scripts. pnpm 11+ fails the install when a dependency has a
# build script that isn't listed here.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: false
